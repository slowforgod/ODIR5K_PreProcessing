experiment_name: "v7_efficientnet_seed42"
model_name: "efficientnet"
num_classes: 7
class_names: ["N", "D", "G", "C", "A", "H", "M"]
data:
  image_dir: "data/preprocessed_images"
  csv_path: "data/full_df.csv"
  split_path: "data/patient_split_7class_stratified_811.json"
  split_train_key: "train_patients"
  split_val_key: "val_patients"
  split_test_key: "test_patients"
  patient_id_col: "ID"
  filename_col: "filename"
  class_cols: ["N", "D", "G", "C", "A", "H", "M"]
  img_size: 300
train:
  batch_size: 32
  num_epochs: 30           # (1) v6과 동일하게 유지
  # (2) EfficientNet-B3 전용: backbone/head 학습률 분리.
  #     lr 키는 단일 LR fallback 용으로만 남겨두고, 실제로는 아래 두 값을 사용.
  lr: 1.0e-4
  backbone_lr: 5.0e-5      # features (ImageNet pretrained) — 천천히
  head_lr: 5.0e-4          # classifier (새로 학습) — 빠르게
  weight_decay: 1.0e-4
  dropout: 0.4
  patience: 6
  seed: 42
  device: "cuda"
  num_workers: 4
  use_amp: true
  optimizer: "adam"
  grad_clip: 1.0
  eta_min: 1.0e-6
preprocessing:
  variants: ["V1_L", "V1_LA", "V1_LB", "V1_LAB"]
  clip_limit: 2.0
  tile_grid_size: [8, 8]
  lse_target_mode: "custom"
  lse_custom_target_count: 850
  lse_max_aug_per_source: 12
  # (4-a) H 클래스 집중 보강 — LSE target/max_aug 차등화 (전처리 단, 손실함수 무관)
  lse_per_class_target:
    H: 1100
  lse_per_class_max_aug:
    H: 18
  hflip_p: 0.5
  vflip_p: 0.1
  geo_p: 0.8
  rotate_limit: 20
  affine_scale: [0.85, 1.15]
  affine_translate: 0.07
  affine_rotate: 15
  affine_shear: 5
  crop_scale: [0.82, 1.0]
  color_jitter_p: 0.3
  brightness: 0.1
  contrast: 0.1
  saturation: 0.05
  blur_p: 0.2
  blur_limit: [3, 5]
  # (4-b) 소수 클래스(H) 복제본 전용 강증강 — 단순 복제 반복 대신 변형 다양성 확보.
  #       aug_idx >= 1 이면서 라벨에 strong_aug_classes 가 포함된 샘플에만 적용.
  strong_aug_classes: ["H"]
  strong_aug:
    geo_p: 0.95
    rotate_limit: 35
    affine_scale: [0.75, 1.25]
    affine_translate: 0.12
    affine_rotate: 25
    affine_shear: 8
    crop_scale: [0.70, 1.0]
    color_jitter_p: 0.5
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
    blur_p: 0.3
    blur_limit: [3, 7]
  # EfficientNet-B3는 ResNet과 stage 구조가 달라 [0,1,2,3] mixup 직접 매핑이
  # 불가하므로 input-mixup (k=0) 만 사용.
  mixup_alpha: 0.2
  mixup_layers: [0]
  mixup_prob: 0.5
losses:
  experiments: ["robust_asymmetric_loss", "cb_bce_with_logits_loss", "cb_focal_loss"]
  focal_alpha: 0.75
  focal_gamma: 2.0
  ral_gamma_neg: 2.0
  ral_gamma_pos: 1.0
  ral_clip: 0.05
  ral_lambda: 1.5
  ral_pos_terms: 2
  ral_neg_terms: 2
  cb_beta: 0.9999
  cb_weight_normalize: "mean_one"
output_dir: "analysis/EfficientNet/v7_analysis"
