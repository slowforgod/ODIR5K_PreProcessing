experiment_name: "v1_LA_efficientnet_seed42"
model_name: "efficientnet"
num_classes: 7
class_names: ["N", "D", "G", "C", "A", "H", "M"]

data:
  image_dir: "data/preprocessed_images"
  csv_path: "data/full_df.csv"
  split_path: "data/patient_split_7class_stratified_811.json"
  split_train_key: "train_patients"
  split_val_key: "val_patients"
  split_test_key: "test_patients"
  patient_id_col: "ID"
  filename_col: "filename"
  class_cols: ["N", "D", "G", "C", "A", "H", "M"]
  img_size: 300

train:
  batch_size: 32
  num_epochs: 30
  lr: 1.0e-4
  weight_decay: 1.0e-4
  dropout: 0.4
  patience: 6
  seed: 42
  device: "cuda"
  num_workers: 4
  use_amp: true

preprocessing:
  clip_limit: 2.0
  tile_grid_size: [8, 8]

output_dir: "analysis/EfficientNet/v1_analysis/V1_LA"
