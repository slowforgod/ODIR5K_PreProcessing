experiment_name: "CLAHE_DBLoss_efficientnet_seed42"
model_name: "efficientnet"
num_classes: 7
class_names: ["N", "D", "G", "C", "A", "H", "M"]

data:
  image_dir: "data/preprocessed_images"
  csv_path: "data/full_df.csv"
  split_path: "data/patient_split_7class_stratified_811.json"
  split_train_key: "train_patients"
  split_val_key: "val_patients"
  split_test_key: "test_patients"
  patient_id_col: "ID"
  filename_col: "filename"
  class_cols: ["N", "D", "G", "C", "A", "H", "M"]
  img_size: 300

train:
  batch_size: 32
  num_epochs: 30
  lr: 1.0e-4
  weight_decay: 1.0e-4
  dropout: 0.4
  patience: 8
  seed: 42
  device: "cuda"
  num_workers: 4
  use_amp: true
  grad_clip: 1.0

preprocessing:
  # V1 soft-routing 베이스: CLAHE 4변종, 증강/LSE/mixup 없음
  variants: ["V1_L", "V1_LA", "V1_LB", "V1_LAB"]
  clip_limit: 2.0
  tile_grid_size: [8, 8]

losses:
  # Distribution-Balanced Loss. 기본값은 공식 레포 COCO config 출발점 —
  # 7-class fundus 환경이라 튜닝 대상.
  name: "db"
  db_map_alpha: 0.1
  db_map_beta: 10.0
  db_map_gamma: 0.2
  db_neg_scale: 2.0
  db_init_bias: 0.05

output_dir: "analysis/EfficientNet/CLAHE_DBLoss_analysis"
