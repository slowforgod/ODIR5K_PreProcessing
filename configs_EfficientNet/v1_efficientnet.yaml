experiment_name: "v1_efficientnet_seed42"
model_name: "efficientnet"
num_classes: 7
class_names: ["N", "D", "G", "C", "A", "H", "M"]

data:
  image_dir: "data/preprocessed_images"
  csv_path: "data/full_df.csv"
  split_path: "data/patient_split_7class_stratified_811.json"
  split_train_key: "train_patients"
  split_val_key: "val_patients"
  split_test_key: "test_patients"
  patient_id_col: "ID"
  filename_col: "filename"
  class_cols: ["N", "D", "G", "C", "A", "H", "M"]
  img_size: 300

train:
  batch_size: 32
  dropout: 0.4
  device: "cuda"
  num_workers: 4

preprocessing:
  clip_limit: 2.0
  tile_grid_size: [8, 8]

# 각 variant의 best.pth / thresholds.npy 경로
variants:
  V1_L:   "analysis/EfficientNet/v1_analysis/V1_L"
  V1_LA:  "analysis/EfficientNet/v1_analysis/V1_LA"
  V1_LB:  "analysis/EfficientNet/v1_analysis/V1_LB"
  V1_LAB: "analysis/EfficientNet/v1_analysis/V1_LAB"

output_dir: "analysis/EfficientNet/v1_analysis"
