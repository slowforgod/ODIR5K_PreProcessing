experiment_name: "v4_resnet50_seed42"
model_name: "resnet50"
num_classes: 7
class_names: ["N", "D", "G", "C", "A", "H", "M"]

data:
  image_dir: "data/preprocessed_images"
  csv_path: "data/full_df.csv"
  split_path: "data/patient_split_7class_stratified_811.json"
  split_train_key: "train_patients"
  split_val_key: "val_patients"
  split_test_key: "test_patients"
  patient_id_col: "ID"
  filename_col: "filename"
  class_cols: ["N", "D", "G", "C", "A", "H", "M"]
  img_size: 224

train:
  batch_size: 32
  num_epochs: 20
  lr: 1.0e-4
  weight_decay: 1.0e-4
  dropout: 0.5
  patience: 8
  seed: 42
  device: "cuda"
  num_workers: 4
  use_amp: true
  optimizer: "adam"

preprocessing:
  # V1 CLAHE — V0 제외 (V0+aug 는 V2 와 동일 → V2 결과 재사용)
  variants: ["V1_L", "V1_LA", "V1_LB", "V1_LAB"]
  clip_limit: 2.0
  tile_grid_size: [8, 8]
  # V2 LSE oversampling
  lse_target_mode: "custom"
  lse_custom_target_count: 850
  lse_max_aug_per_source: 12
  # V2 Augmentation
  hflip_p: 0.5
  vflip_p: 0.1
  geo_p: 0.8
  rotate_limit: 20
  affine_scale: [0.85, 1.15]
  affine_translate: 0.07
  affine_rotate: 15
  affine_shear: 5
  crop_scale: [0.82, 1.0]
  color_jitter_p: 0.3
  brightness: 0.1
  contrast: 0.1
  saturation: 0.05
  blur_p: 0.2
  blur_limit: [3, 5]

losses:
  experiments: ["cb_bce_with_logits_loss"]
  cb_weight_mode: "inverse_frequency"   # w_i ∝ 1/n_i, normalized to mean=1
  cb_weight_normalize: "mean_one"
  # kept for back-compat (unused when cb_weight_mode == "inverse_frequency")
  cb_beta: 0.9999

output_dir: "analysis/v4_analysis"
