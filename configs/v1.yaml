experiment_name: "v1_resnet50_seed42"
model_name: "resnet50"
num_classes: 7
class_names: ["N", "D", "G", "C", "A", "H", "M"]

data:
  image_dir: "data/preprocessed_images"
  csv_path: "data/full_df.csv"
  split_path: "data/patient_split_7class_stratified_811.json"   # 변경: 8:1:1
  split_train_key: "train_patients"
  split_val_key: "val_patients"
  split_test_key: "test_patients"                                # 추가
  patient_id_col: "ID"
  filename_col: "filename"
  class_cols: ["N", "D", "G", "C", "A", "H", "M"]
  img_size: 224

train:
  batch_size: 32
  num_epochs: 20
  lr: 1.0e-4
  weight_decay: 1.0e-4
  dropout: 0.5
  patience: 8
  seed: 42
  device: "cuda"
  num_workers: 4
  use_amp: true

preprocessing:
  variants: ["V0", "V1_L", "V1_LA", "V1_LB", "V1_LAB"]
  clip_limit: 2.0
  tile_grid_size: [8, 8]

routing:
  hard:
    N: "V1_LA"
    D: "V1_LB"
    G: "V0"
    C: "V1_LAB"
    A: "V1_L"
    H: "V1_LB"
    M: "V1_L"

output_dir: "analysis/v1_analysis"