experiment_name: "v5_resnet50_seed42"
model_name: "resnet50"
num_classes: 7
class_names: ["N", "D", "G", "C", "A", "H", "M"]

data:
  image_dir: "data/preprocessed_images"
  csv_path: "data/full_df.csv"
  split_path: "data/patient_split_7class_stratified.json"
  split_train_key: "train_patients"
  split_val_key: "val_patients"
  patient_id_col: "ID"
  filename_col: "filename"
  class_cols: ["N", "D", "G", "C", "A", "H", "M"]
  img_size: 224

train:
  batch_size: 32
  num_epochs: 20
  lr: 1.0e-4
  weight_decay: 1.0e-4
  dropout: 0.5
  patience: 8
  seed: 42
  device: "cuda"
  num_workers: 4
  use_amp: true
  # No optimizer key — V5 uses AdamW (trainer default)

preprocessing:
  # V1 CLAHE — V0 제외 (V4/V6 와 통일)
  variants: ["V1_L", "V1_LA", "V1_LB", "V1_LAB"]
  clip_limit: 2.0
  tile_grid_size: [8, 8]
  # V3 Manifold Mixup (handled in trainer)
  mixup_alpha: 0.2
  mixup_layers: [0, 1, 2, 3]

losses:
  experiments: ["robust_asymmetric_loss", "cb_bce_with_logits_loss", "cb_focal_loss"]
  focal_alpha: 0.75
  focal_gamma: 2.0
  ral_gamma_neg: 2.0
  ral_gamma_pos: 1.0
  ral_clip: 0.05
  ral_lambda: 1.5
  ral_pos_terms: 2
  ral_neg_terms: 2
  cb_beta: 0.9999
  cb_weight_normalize: "mean_one"

output_dir: "analysis/v5_analysis"
