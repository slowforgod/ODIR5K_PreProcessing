experiment_name: "v2_resnet50_seed42"
model_name: "resnet50"
num_classes: 7
class_names: ["N", "D", "G", "C", "A", "H", "M"]

data:
  image_dir: "data/preprocessed_images"
  csv_path: "data/full_df.csv"
  split_path: "data/patient_split_7class_stratified_811.json"   # 변경: 8:1:1
  split_train_key: "train_patients"
  split_val_key: "val_patients"
  split_test_key: "test_patients"                                # 추가
  patient_id_col: "ID"
  filename_col: "filename"
  class_cols: ["N", "D", "G", "C", "A", "H", "M"]
  img_size: 224

train:
  batch_size: 32
  num_epochs: 20
  lr: 1.0e-4
  weight_decay: 1.0e-4
  dropout: 0.5
  patience: 8
  seed: 42
  device: "cuda"
  num_workers: 4
  use_amp: true
  optimizer: "adam"            # NOT adamw — V2 uses plain Adam

preprocessing:
  # LSE oversampling
  lse_target_mode: "custom"
  lse_custom_target_count: 850
  lse_max_aug_per_source: 12

  # Augmentation strengths
  hflip_p: 0.5
  vflip_p: 0.1
  geo_p: 0.8
  rotate_limit: 20
  affine_scale: [0.85, 1.15]
  affine_translate: 0.07
  affine_rotate: 15
  affine_shear: 5
  crop_scale: [0.82, 1.0]
  color_jitter_p: 0.3
  brightness: 0.1
  contrast: 0.1
  saturation: 0.05
  blur_p: 0.2
  blur_limit: [3, 5]

losses:
  experiments: ["robust_asymmetric_loss", "cb_bce_with_logits_loss", "cb_focal_loss"]
  focal_alpha: 0.75
  focal_gamma: 2.0
  ral_gamma_neg: 2.0
  ral_gamma_pos: 1.0
  ral_clip: 0.05
  ral_lambda: 1.5
  ral_pos_terms: 2
  ral_neg_terms: 2
  cb_beta: 0.9999
  cb_weight_normalize: "mean_one"

output_dir: "analysis/resnet50/v2_analysis"